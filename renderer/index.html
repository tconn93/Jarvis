<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Surf</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="window" class="window">
      <header>
        <div class="identity">
          <strong id="name">Surf</strong>
          <span id="status">Needs setup</span>
        </div>
        <button id="mic" type="button" aria-label="Mute microphone">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z" />
            <path d="M6 11a6 6 0 0 0 12 0" fill="none" stroke="currentColor" stroke-width="1.8" />
            <path d="M12 17v3" fill="none" stroke="currentColor" stroke-width="1.8" />
          </svg>
        </button>
        <button id="chevron" type="button" aria-label="Expand">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" />
          </svg>
        </button>
      </header>

      <form id="setup" hidden>
        <label>
          Agent name
          <input id="setup-name" name="name" autocomplete="off" maxlength="32" placeholder="Nova" />
        </label>
        <label>
          API key
          <input id="setup-key" name="key" type="password" autocomplete="off" placeholder="xai-…" />
        </label>
        <p id="setup-error" class="error" role="alert"></p>
        <button id="setup-save" type="submit">Start listening</button>
      </form>

      <section id="panel" hidden>
        <div id="confirm" class="confirm" hidden>
          <p id="confirm-q"></p>
          <div class="confirm-actions">
            <button id="yes" type="button">Yes</button>
            <button id="no" type="button">No</button>
          </div>
        </div>
        <h2>Now</h2>
        <ol id="now"></ol>
        <h2>Log</h2>
        <ol id="log"></ol>
        <button id="stop" type="button">Stop</button>
        <form id="rename-form" class="rename">
          <label>
            Name
            <input id="rename" maxlength="32" />
          </label>
          <label>
            Voice
            <input id="voice" maxlength="32" />
          </label>
          <button type="submit">Save</button>
        </form>
      </section>
    </div>
    <audio id="player" hidden></audio>
    <script src="demo-bridge.js"></script>
    <script src="app.js"></script>
  </body>
</html>
